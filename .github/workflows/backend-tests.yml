name: Backend tests

on:
  push:
    branches: [ main, master ]
    paths: [ 'webapp/backend/**', '.github/workflows/backend-tests.yml' ]
  pull_request:
    paths: [ 'webapp/backend/**', '.github/workflows/backend-tests.yml' ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: webapp/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
